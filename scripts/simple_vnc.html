<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Simple VNC Viewer</title>
  <style>
    body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }
    #noVNC { width:100%; height:100%; position:absolute; top:0; left:0; }
    .controls { position:absolute; top:10px; right:10px; z-index:1000; }
    button { padding:8px 12px; margin:2px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="noVNC"></div>
  <div class="controls">
    <button onclick="toggleFullScreen()">Vollbild</button>
    <button onclick="document.getElementById('noVNC').style.display='none';">Ausblenden</button>
  </div>
  <script src="/usr/share/novnc/app/ui.js"></script>
  <script>
    function initSimpleVNC() {
      const params = {
        url: "ws://localhost:5901",
        errorHandler: function(msg) { console.error("VNC Fehler:", msg); },
        onError: function(msg) { console.error("VNC Fehler:", msg); },
        onLog: function(msg) { console.log("VNC Log:", msg); },
      };
      const vnc = new noVNC.HTML5Client(params);
      document.getElementById('noVNC').appendChild(vnc.getElement());
      vnc.connect();
    }
    function toggleFullScreen() {
      document.getElementById('noVNC').style.position = 'fixed';
      document.getElementById('noVNC').style.zIndex = '2000';
    }
    window.onload = initSimpleVNC;
  </script>
</body>
</html>
