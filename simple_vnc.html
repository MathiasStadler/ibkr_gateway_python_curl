<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Direct VNC Viewer</title>
  <style>
    body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#1a1a1a; }
    #noVNC_container { width:100%; height:100%; position:absolute; top:0; left:0; }
    .controls { 
      position:absolute; top:10px; right:10px; z-index:1000; 
      background:rgba(0,0,0,0.7); padding:10px; border-radius:8px;
      display:flex; gap:8px;
    }
    button { 
      padding:10px 16px; cursor:pointer; 
      background:#333; color:#fff; border:1px solid #555; border-radius:4px;
      font-size:14px;
    }
    button:hover { background:#444; }
    .status { 
      position:absolute; bottom:10px; left:10px; z-index:1000;
      color:#aaa; font-size:12px; font-family:monospace;
    }
  </style>
</head>
<body>
  <div id="noVNC_container"></div>
  <div class="controls">
    <button onclick="vnc && vnc.requestFullScreen()">Vollbild</button>
    <button onclick="vnc && vnc.disconnect(); vnc.connect()">Neu verbinden</button>
    <button onclick="vnc && vnc.sendCtrlAltDel()">Strg+Alt+Entf</button>
  </div>
  <div class="status" id="status">Verbinde...</div>

  <script src="/novnc/app/ui.js"></script>
  <script>
    let vnc = null;
    
    function updateStatus(msg) {
      document.getElementById('status').textContent = new Date().toLocaleTimeString() + ' - ' + msg;
    }

    function initVNC() {
      const container = document.getElementById('noVNC_container');
      const wsUrl = 'ws://localhost:5901';
      
      updateStatus('Verbinde zu ' + wsUrl + '...');
      
      const params = {
        target: container,
        url: wsUrl,
        onError: function(msg) {
          updateStatus('Fehler: ' + msg);
          console.error('VNC Fehler:', msg);
        },
        onDisconnect: function(e) {
          updateStatus('Getrennt: ' + (e.reason || 'unbekannt'));
        },
        onConnect: function() {
          updateStatus('Verbunden ✓');
        },
        onLog: function(msg) {
          console.log('VNC:', msg);
        },
        encryption: false,
        true_color: true,
        local_cursor: true,
        shared: true,
        view_only: false,
      };
      
      vnc = new noVNC.RFB(params);
      
      vnc.addEventListener('connect', function(e) {
        updateStatus('Verbunden ✓');
      });
      
      vnc.addEventListener('disconnect', function(e) {
        updateStatus('Getrennt: ' + (e.detail?.reason || 'unbekannt'));
      });
      
      vnc.addEventListener('securityfailure', function(e) {
        updateStatus('Auth-Fehler: ' + e.detail?.reason || 'unknown');
      });
      
      vnc.addEventListener('bell', function() {
        updateStatus('Bell (Glocken-Signal)');
      });
    }
    
    window.onload = initVNC;
  </script>
</body>
</html>
